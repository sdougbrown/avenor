[tasks.js-core-build]
description = "Build @dougbots/avenor-core"
dir = "packages/core"
sources = ["src/**/*.ts", "tsdown.config.ts", "package.json"]
outputs = ["dist/index.js"]
run = "bun run build"

[tasks.js-mcp-build]
description = "Build @dougbots/avenor-mcp"
dir = "packages/mcp"
depends = ["js-core-build"]
sources = ["src/**/*.ts", "tsdown.config.ts", "package.json"]
outputs = ["dist/index.js"]
run = "bun run build"

[tasks.js-opencode-build]
description = "Build @dougbots/avenor-opencode"
dir = "packages/opencode"
depends = ["js-core-build"]
sources = ["src/**/*.ts", "tsdown.config.ts", "package.json"]
outputs = ["dist/index.js"]
run = "bun run build"

[tasks.js-pi-build]
description = "Build @dougbots/avenor-pi"
dir = "packages/pi"
depends = ["js-core-build"]
sources = ["src/**/*.ts", "tsdown.config.ts", "package.json"]
outputs = ["dist/index.js"]
run = "bun run build"

[tasks.js-board-build]
description = "Build @dougbots/avenor-board frontend"
dir = "packages/board"
depends = []
sources = ["src/**/*.ts", "src/**/*.tsx", "src/**/*.css", "index.html", "vite.config.ts", "tsconfig.json", "package.json"]
outputs = ["dist/index.html"]
run = "bun run build"

[tasks.js-build]
description = "Build all JS packages"
depends = ["js-mcp-build", "js-opencode-build", "js-pi-build", "js-board-build"]

[tasks.js-test]
description = "Test all JS packages"
depends = ["js-build"]
run = ["cd packages/core && bun test", "cd packages/mcp && bun test", "cd packages/opencode && bun test", "cd packages/pi && bun test"]

[tasks.go-build]
description = "Build the avenor Go binary (without board frontend)"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["avenor"]
run = "mkdir -p .cache/go-build .cache/go-mod && GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go build -o avenor ./cmd/avenor"

[tasks.go-build-full]
description = "Build the avenor Go binary with board frontend embedded"
depends = ["js-board-build"]
sources = ["**/*.go", "go.mod", "go.sum", "packages/board/dist/index.html"]
outputs = ["avenor"]
run = """
rm -rf internal/board/dist
cp -r packages/board/dist internal/board/dist
mkdir -p .cache/go-build .cache/go-mod
GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go build -tags board -o avenor ./cmd/avenor
"""

[tasks.go-test]
description = "Test Go packages (without board frontend)"
sources = ["**/*.go", "go.mod", "go.sum"]
run = "mkdir -p .cache/go-build .cache/go-mod && GOCACHE=$PWD/.cache/go-build GOMODCACHE=$PWD/.cache/go-mod go test ./..."

[tasks.build]
description = "Build the avenor Go binary and all JS packages"
depends = ["go-build", "js-build"]

[tasks.test]
description = "Test Go packages and all JS packages"
depends = ["go-test", "js-test"]

[tasks.js-dev]
description = "Watch all JS packages"
run = ["cd packages/core && bun run dev & cd packages/mcp && bun run dev & cd packages/opencode && bun run dev & cd packages/pi && bun run dev & wait"]

[tasks.docs-dev]
description = "Serve docs site locally"
dir = "docs"
run = "bun run dev"

[tasks.docs-build]
description = "Build docs site"
dir = "docs"
run = "bun run build"
