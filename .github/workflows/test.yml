name: Test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify generated Umpire output
        run: |
          set -euo pipefail
          for generated in internal/spawnselection/spawn_selection.gen.go internal/thinkingpolicy/thinking_policy.gen.go internal/workflow/workflow_schema.gen.go; do
            git ls-files --error-unmatch -- "$generated"
            first_generated="$(mktemp)"
            cp -- "$generated" "$first_generated"
            first_checksum="$(sha256sum "$first_generated" | awk '{print $1}')"
            go generate ./internal/spawnselection ./internal/thinkingpolicy ./internal/workflow
            test "$first_checksum" = "$(sha256sum "$generated" | awk '{print $1}')"
            cmp -- "$first_generated" "$generated"
            git diff --exit-code -- "$generated"
            rm -f "$first_generated"
          done
          # Fail on any drift, including a newly untracked generated file.
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Build Go binary
        run: mise run go-build

      - name: Test Go packages
        run: mise run go-test

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test escalation bridge
        run: python3 -m unittest discover -s templates/escalation-bridge -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # VitePress fails the build on dead internal links. Links rewritten to
      # GitHub URLs are external, so the build cannot see them — run the
      # transformer's unit tests, then HEAD-check every emitted GitHub URL.
      - name: Build docs
        run: bun run --cwd docs build

      - name: Test link transformer
        run: bun test ./docs/.vitepress/escaped-links.test.ts

      - name: Check GitHub links resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `|| true` keeps a no-match grep from tripping pipefail before
          # the empty-result guard below can produce its diagnostic.
          urls="$(grep -rohE 'href="https://github\.com/sdougbrown/avenor/(blob|tree)/main/[^"#]*' docs/.vitepress/dist \
            | sed -E 's/^href="//; s/#.*$//' \
            | sort -u)" || true
          if [ -z "$urls" ]; then
            echo "no rewritten GitHub URLs found in docs build output" >&2
            exit 1
          fi
          # Resolve each path through the REST API instead of HEAD-checking
          # the blob/tree page: the html endpoints intermittently answer
          # anonymous datacenter requests with 503 even when the path exists,
          # and a 503 says nothing about the link. A 404 is the only verdict
          # that means the link is dead; 429/5xx are retried with backoff and,
          # if they persist, reported as unverified rather than dead.
          status=0
          while IFS= read -r url; do
            path="${url#https://github.com/sdougbrown/avenor/}"
            path="${path#blob/main/}"
            path="${path#tree/main/}"
            api="https://api.github.com/repos/sdougbrown/avenor/contents/$path?ref=main"
            if [ -z "$path" ]; then
              api="https://api.github.com/repos/sdougbrown/avenor"
            fi
            code=000
            for attempt in 1 2 3 4; do
              code="$(curl -s -o /dev/null -w '%{http_code}' ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} "$api")"
              case "$code" in
                200|404) break ;;
                *) [ "$attempt" -lt 4 ] && sleep $((attempt * 2)) ;;
              esac
            done
            case "$code" in
              200) ;;
              404) echo "DEAD: $url -> HTTP 404" >&2; status=1 ;;
              *) echo "UNVERIFIED (GitHub unavailable): $url -> HTTP $code" >&2 ;;
            esac
          done <<< "$urls"
          exit "$status"

  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install package dependencies
        run: bun install

      - name: Build JS packages
        run: mise run js-build

      - name: Test JS packages
        run: mise run js-test
