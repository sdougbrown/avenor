name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install package dependencies
        run: bun install

      - name: Build
        run: mise run build

      - name: Test
        run: mise run test
