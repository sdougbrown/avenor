name: Test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify generated spawn selection
        run: |
          set -euo pipefail
          generated=internal/spawnselection/spawn_selection.gen.go
          git ls-files --error-unmatch -- "$generated"
          first_generated="$(mktemp)"
          trap 'rm -f "$first_generated"' EXIT
          go generate ./internal/spawnselection
          cp -- "$generated" "$first_generated"
          first_checksum="$(sha256sum "$first_generated" | awk '{print $1}')"
          go generate ./internal/spawnselection
          test "$first_checksum" = "$(sha256sum "$generated" | awk '{print $1}')"
          cmp -- "$first_generated" "$generated"
          git diff --exit-code -- "$generated"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Build Go binary
        run: mise run go-build

      - name: Test Go packages
        run: mise run go-test

  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install package dependencies
        run: bun install

      - name: Build JS packages
        run: mise run js-build

      - name: Test JS packages
        run: mise run js-test
