name: Test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Verify generated Umpire output
        run: |
          set -euo pipefail
          for generated in internal/spawnselection/spawn_selection.gen.go internal/thinkingpolicy/thinking_policy.gen.go; do
            git ls-files --error-unmatch -- "$generated"
            first_generated="$(mktemp)"
            cp -- "$generated" "$first_generated"
            first_checksum="$(sha256sum "$first_generated" | awk '{print $1}')"
            go generate ./internal/spawnselection ./internal/thinkingpolicy
            test "$first_checksum" = "$(sha256sum "$generated" | awk '{print $1}')"
            cmp -- "$first_generated" "$generated"
            git diff --exit-code -- "$generated"
            rm -f "$first_generated"
          done
          # Fail on any drift, including a newly untracked generated file.
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Build Go binary
        run: mise run go-build

      - name: Test Go packages
        run: mise run go-test

  js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install package dependencies
        run: bun install

      - name: Build JS packages
        run: mise run js-build

      - name: Test JS packages
        run: mise run js-test
